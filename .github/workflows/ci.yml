name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# o job só lê o código; nada de escrita no repositório
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, format, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      # astro check (tipos) + astro build
      - name: Build
        run: npm run build

      # o build da CI não tem a flag: o gateway, o store e o anúncio da inscrição simulada não podem estar no dist
      - name: Sem simulação no bundle de produção
        run: |
          test -d dist/_astro
          if grep -rlE 'hackarun:dev:simulated-teams|Simulated failure|Inscrição simulada' dist; then
            echo "::error::código da inscrição simulada no build sem PUBLIC_REGISTRATION_SIMULATED"
            exit 1
          fi

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7
